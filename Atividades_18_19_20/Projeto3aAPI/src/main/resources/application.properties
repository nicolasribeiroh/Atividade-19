spring.application.name=Projeto3aAPI

# Porta: no Render vem da variavel PORT (8080); localmente usa 8081 (Atividade 20)
server.port=${PORT:8081}

# Configuracoes do PostgreSQL
# No Render, os valores vem das variaveis de ambiente SPRING_DATASOURCE_*
# Localmente, usa os valores depois dos dois-pontos (ajuste a senha!)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projeto3aapi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sua_senha_aqui}

# Configuracoes JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator config
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informacoes customizadas da aplicacao
info.app.name=Projeto3aAPI
info.app.description=API REST com Spring Boot e PostgreSQL
info.app.version=1.0.0
info.app.author=Seu Nome
info.app.ambiente=producao
